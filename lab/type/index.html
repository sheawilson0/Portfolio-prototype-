<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Type lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; font-family: system-ui, sans-serif; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  .pick { position: fixed; left: 50%; bottom: 18px; translate: -50% 0; z-index: 9; display: flex; gap: 4px; padding: 4px;
    border-radius: 999px; background: rgba(20,20,20,.82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .pick button { font: 500 13px/1 system-ui, sans-serif; color: #ddd; background: none; border: 0; border-radius: 999px; padding: 9px 14px; cursor: pointer; }
  .pick button[aria-pressed="true"] { background: #fff; color: #111; }
</style>
</head>
<body>
<iframe id="f" src="/" title="Homepage"></iframe>
<div class="pick" role="group" aria-label="Type style">
  <button data-v="now">Now</button>
  <button data-v="scatter">Scattered</button>
  <button data-v="block">Block</button>
</div>
<script>
/* Restyles the real homepage's top in place (same site, so the frame can be reached). Nothing on the live page changes. */
const CSS = `
.lab { display: none !important; }
/* Scattered: the three words sit on a 12-column grid at odd places, the paragraph takes a column of its own. */
body[data-type="scatter"] .hero-copy { width: min(100%, 1180px); text-align: left; }
body[data-type="scatter"] .hero h1 { display: grid; grid-template-columns: repeat(12, 1fr); row-gap: .02em;
  font-size: clamp(46px, 7.4vw, 118px); line-height: 1; text-wrap: initial; }
body[data-type="scatter"] .hero h1 .w1 { grid-column: 1 / 7; grid-row: 1; }
body[data-type="scatter"] .hero h1 .w2 { grid-column: 6 / 13; grid-row: 2; justify-self: end; }
body[data-type="scatter"] .hero h1 .w3 { grid-column: 3 / 11; grid-row: 3; }
body[data-type="scatter"] .hero .intro { margin: 34px 0 0 calc(100% / 12 * 7); max-width: none; text-align: left; }
@media (max-width: 720px) {
  body[data-type="scatter"] .hero h1 { grid-template-columns: repeat(4, 1fr); font-size: 15vw; }
  body[data-type="scatter"] .hero h1 .w1 { grid-column: 1 / 4; }
  body[data-type="scatter"] .hero h1 .w2 { grid-column: 2 / 5; }
  body[data-type="scatter"] .hero h1 .w3 { grid-column: 1 / 5; justify-self: end; }
  body[data-type="scatter"] .hero .intro { margin-left: 25%; }
}

/* Block: every line runs edge to edge, so the words make a rectangle. Headline lines are sized to fit, the paragraph is
   justified (last line too), so the gaps between words change line to line. */
body[data-type="block"] .hero-copy { width: min(100%, 470px); text-align: left; }
body[data-type="block"] .intro-who { display: inline; }
body[data-type="block"] .hero h1 { line-height: .94; text-wrap: initial; }
body[data-type="block"] .hero h1 .ln { display: block; white-space: nowrap; width: max-content; }
body[data-type="block"] .hero .intro { margin-top: 22px; max-width: none; font-size: clamp(17px, 1.4vw, 20px); line-height: 1.42;
  color: var(--ink); text-align: justify; text-align-last: justify; hyphens: none; text-wrap: initial; }
body[data-type="block"] .hero .intro .last { white-space: normal; }
`;

const f = document.getElementById('f');
let d, h1, orig;

function fit() {
  if (!d || d.body.dataset.type !== 'block') return;
  const box = d.querySelector('.hero-copy').clientWidth;
  h1.querySelectorAll('.ln').forEach(ln => {
    ln.style.fontSize = '100px';
    ln.style.fontSize = (100 * box / ln.getBoundingClientRect().width) + 'px';
  });
}

function set(v) {
  document.querySelectorAll('.pick button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  if (!d) return;
  d.body.dataset.type = v;
  h1.innerHTML =
    v === 'scatter' ? '<span class="w1">Always</span><span class="w2">making</span><span class="w3"><em>something.</em></span>' :
    v === 'block'   ? '<span class="ln">Always making</span><span class="ln"><em>something.</em></span>' : orig;
  fit();
  try { history.replaceState(null, '', '#' + v); } catch (e) {}
}

f.addEventListener('load', () => {
  d = f.contentDocument;
  h1 = d.querySelector('.hero h1');
  orig = h1.innerHTML;
  const s = d.createElement('style'); s.textContent = CSS; d.head.appendChild(s);
  d.fonts.ready.then(fit);
  f.contentWindow.addEventListener('resize', fit);
  set(location.hash.slice(1) || 'block');
});
document.querySelectorAll('.pick button').forEach(b => b.onclick = () => set(b.dataset.v));
</script>
</body>
</html>
