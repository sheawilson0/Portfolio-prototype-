<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<title>Share cards, Shea Wilson</title>
<!-- Source of assets/share/card-*.png, the picture a link shows on X, LinkedIn and in messages.
     Open /tools/og.html?p=home (or snapshot, quit28, jumpstart, braindump, cipher, amp, shipped) and capture 1200x630 at scale 1.
     og-art/ holds each project's homepage card, captured at midday with the page behind it see-through. -->
<link rel="stylesheet" href="/assets/fonts/portfolio.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; font-family: 'DM Sans', system-ui, sans-serif; color: #0a0a0a; -webkit-font-smoothing: antialiased;
    background: radial-gradient(70% 60% at 50% 104%, rgba(255,241,226,.95), rgba(255,241,226,0) 100%), linear-gradient(180deg, #9ec0e9 0%, #cdd9e9 56%, #f9ede2 100%); }
  .nm { position: absolute; left: 64px; top: 50px; font: italic 400 34px/1 'Spectral', serif; letter-spacing: -.012em; }
  .role { position: absolute; right: 64px; top: 58px; font-size: 22px; color: rgba(10,10,10,.6); }
  h1 { font: 300 84px/1.04 'Spectral', serif; letter-spacing: -.03em; word-spacing: -.03em; text-wrap: balance; }
  h1 em { font-style: italic; letter-spacing: -.02em; }
  img { display: block; }
  /* The homepage: its headline over its first row of work, as the page opens. */
  .home h1 { position: absolute; left: 0; right: 0; top: 124px; text-align: center; }
  .home .row { position: absolute; left: 64px; right: 64px; top: 356px; display: flex; gap: 24px; align-items: flex-start; }
  .home .row img { height: 455px; width: auto; }
  /* A project: its name and one line beside its card. */
  .case .copy { position: absolute; left: 64px; top: 120px; bottom: 60px; width: 490px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .case .copy p { font-size: 27px; line-height: 1.35; color: rgba(10,10,10,.62); text-wrap: balance; }
  .case .art { position: absolute; right: 60px; top: 60px; bottom: 60px; width: 560px; display: flex; align-items: center; justify-content: flex-end; }
  .case .art img { max-width: 100%; max-height: 100%; }
</style></head><body>
<script>
  const CARDS = {
    snapshot: ['Smoking Snapshot', 'Used 1,000+ times for the NHS'],
    quit28: ['Quit28', 'A 28-day quit plan, live now'],
    jumpstart: ['JumpStart', 'Paid media reporting, in pilot with the National Football Museum'],
    braindump: ['Brain Dump', 'Sorts what you type or say'],
    cipher: ['Cipher', 'A concept AI-first bank'],
    amp: ['Amp', 'A concept music player'],
    shipped: ['Shipped', 'Everything I’ve made since August'],
  };
  const p = new URLSearchParams(location.search).get('p') || 'home', c = CARDS[p];
  document.body.className = c ? 'case' : 'home';
  document.body.innerHTML = '<p class="nm">Shea Wilson</p>' + (c
    ? `<div class="copy"><h1>${c[0]}</h1><p>${c[1]}</p></div><div class="art"><img src="og-art/${p}.webp" alt=""></div>`
    : `<p class="role">Design engineer</p><h1>Probably making something<br><em>right now.</em></h1><div class="row"><img src="og-art/snapshot.webp" alt=""><img src="og-art/quit28.webp" alt=""></div>`);
</script>
</body></html>
