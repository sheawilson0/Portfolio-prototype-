<body class="calm is-street" data-newest="middle" data-small="small">

<header class="nav">
  <div class="nav-inner">
    <span class="nav-pill" aria-hidden="true"></span>
    <a class="logo" href="/" aria-label="Shea Wilson, home">S<span class="fold"><span>hea&nbsp;</span></span>W<span class="fold"><span>ilson</span></span></a>

      <a href="/#work">Work</a>
      <a href="/#about">About</a>

      </button>
    </nav>
  </div>

<main class="street" id="top" data-street>
  <header class="st-head">
    <h1>Shipped<em>.</em></h1>

  <div class="st-bar">
    <div class="st-filters" data-filters role="group" aria-label="Show">
      <button type="button" data-kind="all" aria-pressed="true">All</button>
      <button type="button" data-kind="personal" aria-pressed="false">Personal</button>
      <button type="button" data-kind="work" aria-pressed="false">Work</button>

    <div class="st-ticks" aria-hidden="true"></div>

  </div>
